<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}API Практика{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .tabs { display: flex; border-bottom: 2px solid #333; margin-bottom: 20px; }
        .tab {
            padding: 10px 20px;
            text-decoration: none;
            color: #333;
            background: #f0f0f0;
            margin-right: 5px;
            border-radius: 5px 5px 0 0;
            font-weight: bold;
        }
        .tab.active {
            background: #333;
            color: #fff;
        }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <nav class="tabs">
        <a href="{% url 'services:pokemon' %}" class="tab {% if active_tab == 'pokemon' %}active{% endif %}">
            Покемоны (Практика 1 и 3)
        </a>
        <a href="{% url 'services:dogs' %}" class="tab {% if active_tab == 'dogs' %}active{% endif %}">
            Собаки (Практика 2)
        </a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
